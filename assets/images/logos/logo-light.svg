<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Light Theme Logo - For use on dark backgrounds -->
  
  <!-- Leaf icon -->
  <g transform="translate(0, 5)">
    <path d="M25 30c0-10 5-18 10-22 5 4 10 12 10 22 0 8-4 15-10 18-6-3-10-10-10-18z" 
      fill="#4CAF50" stroke="#66BB6A" stroke-width="1.5"/>
    <path d="M25 30c0-10 5-18 10-22 5 4 10 12 10 22" 
