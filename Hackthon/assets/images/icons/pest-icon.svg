<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Pest/Bug Icon -->
  <circle cx="12" cy="12" r="3" stroke="#C62828" stroke-width="2" fill="rgba(198,40,40,0.1)"/>
  
  <!-- Antennae -->
  <path d="M10 9.5c-1-1-2.5-1.5-3.5-2" stroke="#C62828" stroke-width="1.5"/>
  <path d="M14 9.5c1-1 2.5-1.5 3.5-2" stroke="#C62828" stroke-width="1.5"/>
  <circle cx="6.5" cy="7.5" r="0.8" fill="#C62828" stroke="none"/>
  <circle cx="17.5" cy="7.5" r="0.8" fill="#C62828" stroke="none"/>
  
  <!-- Legs -->
  <path d="M9 13c-1 1-2.5 1.5-3.5 1" stroke="#C62828" stroke-width="1.5"/>
  <path d="M9 13c-1 2-1.5 3.5-1 4.5" stroke="#C62828" stroke-width="1.5"/>
  <path d="M9 13c-2 1-3.5 1.5-4 2.5" stroke="#C62828" stroke-width="1.5"/>
  
  <path d="M15 13c1 1 2.5 1.5 3.5 1" stroke="#C62828" stroke-width="1.5"/>
  <path d="M15 13c1 2 1.5 3.5 1 4.5" stroke="#C62828" stroke-width="1.5"/>
  <path d="M15 13c2 1 3.5 1.5 4 2.5" stroke="#C62828" stroke-width="1.5"/>
  
  <!-- Wings -->
  <path d="M10 11c-2-1-3.5-1-4.5 0" stroke="#E57373" stroke-width="1" fill="rgba(229,115,115,0.1)"/>
  <path d="M14 11c2-1 3.5-1 4.5 0" stroke="#E57373" stroke-width="1" fill="rgba(229,115,115,0.1)"/>
  
  <!-- Eyes -->
  <circle cx="11" cy="10.5" r="0.8" fill="#C62828" stroke="none"/>
  <circle cx="13" cy="10.5" r="0.8" fill="#C62828" stroke="none"/>
  
  <!-- Warning dots -->
  <circle cx="8" cy="16" r="0.5" fill="#F57C00" stroke="none"/>
  <circle cx="10" cy="16.5" r="0.5" fill="#F57C00" stroke="none"/>
  <circle cx="14" cy="16.5" r="0.5" fill="#F57C00" stroke="none"/>
